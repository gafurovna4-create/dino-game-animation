<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deno</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="game-container">
        <div class="world">
            <img src="dino.png" class="dino">

            <div class="score">HI 00044 00018</div>
            <div class="ground"></div>

            <div class="cactus-group group-1">
                <img src="cactus.png" class="cactus-img">
            </div>

            <div class="cactus-group group-2">
                <img src="cactus.png" class="cactus-img">
                <img src="cactus.png" class="cactus-img">
            </div>

            <div class="cactus-group group-3">
                <img src="cactus.png" class="cactus-img">
                <img src="cactus.png" class="cactus-img">
                <img src="cactus.png" class="cactus-img">
            </div>

            <div class="ground"></div>
        </div>
    </div>
    <div class="dino-container">

        <h1>No Internet</h1>

        <p>Try:</p>
        <ul>
            <li>Checking the network cables, modem and router</li>
            <li>Reconnecting to Wi-Fi</li>
            <li>Running Windows Network Diagnostics</li>
        </ul>

        <code id="error-code">ERR_INTERNET_DISCONNECTED</code>
    </div>
</body>

</html>
